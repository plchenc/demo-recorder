<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Demo Recorder 示例页</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, "Noto Sans CJK SC", sans-serif;
         background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
         color: #e2e8f0; min-height: 100vh; padding: 48px 64px; }
  h1 { font-size: 30px; margin-bottom: 8px; }
  p.sub { color: #94a3b8; margin-bottom: 32px; }
  .card { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
          border-radius: 14px; padding: 24px; max-width: 560px; margin-bottom: 24px; }
  .counter { font-size: 56px; font-weight: 700; color: #7cfc98; margin: 12px 0; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 8px;
           padding: 10px 22px; font-size: 15px; cursor: pointer; margin-right: 10px; }
  button:hover { background: #1d4ed8; }
  input, select { background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
          border-radius: 8px; padding: 10px 12px; font-size: 15px; width: 200px; }
  label { display: block; margin: 14px 0 6px; color: #94a3b8; font-size: 13px; }
  #result { display: none; margin-top: 16px; padding: 14px;
            background: rgba(124,252,152,.12); border-radius: 10px;
            color: #7cfc98; font-size: 16px; }
</style>
</head>
<body>
  <h1>📦 示例：订单演示页</h1>
  <p class="sub">demo-recorder hello 示例 —— 演示 click / type / fill / select / wait_text</p>

  <div class="card">
    <div>今日下单量</div>
    <div class="counter" id="count">0</div>
    <button id="add" onclick="bump()">＋ 添加一单</button>
    <button id="x5" onclick="for(let i=0;i<5;i++) bump()">＋5 连击</button>
  </div>

  <div class="card">
    <label for="cust">客户名称</label>
    <input id="cust" placeholder="请输入客户名">
    <label for="prod">产品</label>
    <select id="prod">
      <option>GPU 服务器 A100</option>
      <option>GPU 服务器 AP100</option>
      <option>智能网关</option>
    </select>
    <div style="margin-top:16px">
      <button id="submit" onclick="submitOrder()">提交订单</button>
    </div>
    <div id="result"></div>
  </div>

<script>
  let n = 0;
  function bump() { n += 1; document.getElementById('count').textContent = n; }
  function submitOrder() {
    const c = document.getElementById('cust').value || '(未填写)';
    const p = document.getElementById('prod').value;
    const r = document.getElementById('result');
    r.style.display = 'block';
    r.textContent = `✅ 订单已受理：${c} × ${p}（第 ${n} 单）`;
  }
</script>
</body>
</html>
